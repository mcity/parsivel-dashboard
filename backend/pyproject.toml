[project]
name = "parsivel-backend"
version = "0.1.0"
description = "Parsivel disdrometer dashboard backend (Flask REST template)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "gunicorn>=22.0",
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
